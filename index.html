<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="Film Agenda: le uscite della settimana scelte da Robi Tuono.">
<meta name="theme-color" content="#1A2FB0">
<title>Film Agenda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Martian+Mono:wdth,wght@75..112.5,300..400&family=VT323&display=swap">
<style>
/* Layout: una colonna da telefono (max 720px) su fondo blu "menu a schermo"; da 960px card su due colonne e scheda con locandina a lato. */
:root{
  --blu:#1A2FB0;        /* fondo: menu a schermo del videoregistratore */
  --blu-scuro:#101c6e;  /* bordo pagina su desktop */
  --bianco:#F2F2F2;     /* testo, 9:1 sul blu */
  --tenue:#C3C9E8;      /* testo secondario, 6:1 */
  --selez:#DADADA;      /* voce selezionata in negativo, testo blu 7,3:1 */
  --giallo:#FFE14D;     /* unico accento: link e azioni, 7,8:1 */
  --filetto:#4a5cc8;
  --pixel:'VT323',ui-monospace,Menlo,monospace;
  --mono:'Martian Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--blu-scuro)}
body{background:var(--blu-scuro);color:var(--bianco);font-family:var(--mono);font-stretch:75%;font-weight:300;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--blu)}
.schermo{position:relative;max-width:720px;margin:0 auto;min-height:100vh;background:var(--blu);padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:28px 48px}
/* righe di scansione, solo decoro */
.schermo::after{content:"";position:fixed;top:0;bottom:0;left:0;right:0;margin:0 auto;width:min(720px,100%);pointer-events:none;z-index:5;background:linear-gradient(transparent 66%,rgba(0,0,30,.2) 66%) 0 0/100% 3px}
@media (min-width:960px){.schermo::after{width:min(1120px,100%)}}
a{color:inherit;text-decoration:none}
button{background:none;border:0;font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--giallo);outline-offset:3px}
.px{font-family:var(--pixel);font-weight:400;letter-spacing:.03em;text-transform:uppercase;font-size-adjust:.58}
.px button,.px a{text-transform:inherit}
.glow{text-shadow:0 0 6px rgba(255,255,255,.25)}

/* testata */
.testata{text-align:center;margin-bottom:14px}
.testata .nome{display:block;font-size:26px;letter-spacing:.08em;white-space:nowrap}
.testata .cura{display:block;font-size:16px;color:var(--tenue)}
.inv{background:var(--selez);color:var(--blu)}
.titolo-pag{display:block;text-align:center;font-size:44px;line-height:1;padding:8px 0 4px}
.navmesi{display:flex;justify-content:space-between;font-size:17px;margin-top:12px}
.navmesi a{color:var(--giallo);padding-block:10px;min-height:44px;display:inline-flex;align-items:center}

/* righe di scelta (settimane, filtri, per mese/genere) */
.scelte{display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px;font-size:16px}
.scelte button,.scelte a{padding:8px 4px 6px;min-height:40px;white-space:nowrap}
.scelte [aria-pressed="true"],.scelte [aria-current="page"]{background:var(--selez);color:var(--blu)}
.scelte .sl{color:var(--tenue)}
.sett{justify-content:space-between;margin-top:10px;flex-wrap:nowrap;gap:2px;font-size:15px;letter-spacing:0}
.sett a{padding-inline:3px}
.filtri{margin-top:2px}
.conta{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;font-size:17px;border-bottom:2px solid var(--bianco);padding:10px 0 6px}

/* intestazione settimana nella vista mese */
.wk{text-align:center;font-size:21px;margin-top:28px}
.wk::before{content:"--- "}.wk::after{content:" ---"}

/* card */
.lista{display:grid;grid-template-columns:minmax(0,1fr)}
.card{display:grid;grid-template-columns:132px minmax(0,1fr);column-gap:16px;padding-block:24px;border-bottom:2px dashed var(--filetto)}
.loc{position:relative;display:block;width:132px;aspect-ratio:2/3;max-width:100%;border:2px solid var(--bianco);overflow:hidden;background:var(--blu-scuro)}
.loc img,.grande img{width:100%;height:100%;object-fit:cover;display:block}
.loc .vuota,.grande .vuota{display:flex;height:100%;align-items:center;justify-content:center;text-align:center;font-size:15px;color:var(--tenue);padding:8px}
.meta{min-width:0}
.riga1{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:16px;color:var(--tenue)}
.tag{border:2px solid var(--bianco);border-radius:6px;padding:0 5px;font-size:14px;color:var(--bianco);line-height:1.3}
.tag.visto{background:var(--selez);border-color:var(--selez);color:var(--blu)}
.card h2{font-size:29px;line-height:.95;margin-top:4px;overflow-wrap:anywhere}
.card .di,.film .di{font-size:16px;margin-top:6px}
.di a{color:var(--giallo)}
.gen{font-size:16px;color:var(--tenue);margin-top:4px}
.dur{display:block;height:9px;border:2px solid var(--bianco);margin-top:8px;max-width:150px;padding:1px}
.dur i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--selez) 0 4px,transparent 4px 6px)}
.plot{grid-column:1/-1;margin-top:16px;max-width:62ch}
.tec{grid-column:1/-1;font-size:15px;color:var(--tenue);margin-top:6px}
.apri{grid-column:1/-1;justify-self:start;color:var(--giallo);font-size:18px;padding-block:8px;margin-top:4px}

/* canvas della tendina DV */
.tend{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;pointer-events:none}

/* scheda film */
.film{display:grid;grid-template-columns:minmax(0,1fr);gap:0}
.indietro{display:inline-flex;align-items:center;min-height:44px;color:var(--giallo);font-size:18px}
.grande{position:relative;width:100%;aspect-ratio:2/3;max-width:100%;border:2px solid var(--bianco);overflow:hidden;margin-top:6px;background:var(--blu-scuro)}
.film h1{font-size:52px;line-height:.9;margin-top:6px;overflow-wrap:anywhere}
.film .gen{color:var(--bianco);font-size:18px}
.film .dur{max-width:220px}
.frase{font-size:17px;line-height:1.45;margin-top:18px;max-width:62ch}
.filo{display:grid;grid-template-columns:24px minmax(0,1fr);margin-top:22px;padding-top:16px;border-top:2px dashed var(--filetto);max-width:66ch}
.filo .seg{color:var(--giallo)}
.sez{border-top:2px dashed var(--filetto);margin-top:24px;padding-top:16px;max-width:66ch}
.et{display:inline-block;font-size:19px;padding:2px 8px 0;margin-bottom:12px}
.regista{font-size:20px}
.regista a{color:var(--giallo)}
.righe{display:grid;grid-template-columns:110px minmax(0,1fr);row-gap:8px;column-gap:12px;font-size:14px;margin-top:12px}
.righe dt{font-family:var(--pixel);text-transform:uppercase;font-size:15px;color:var(--tenue);letter-spacing:.03em}
.righe dd a{color:var(--giallo)}
.righe .anno-p{color:var(--tenue)}
.testo{margin-top:12px}
.critica{display:grid;grid-template-columns:24px minmax(0,1fr);row-gap:10px}
.critica dt{font-family:var(--pixel);font-size:22px;line-height:1.1;color:var(--giallo)}
.voci{list-style:none}
.voci li{padding-block:10px;border-bottom:2px dashed var(--filetto)}
.voci li:last-child{border-bottom:0}
.voci .ruolo{color:var(--tenue)}
.voci a{color:var(--giallo)}
.dove{font-size:14px;color:var(--tenue);margin-bottom:6px}

/* pagina anno */
.cifre{display:grid;grid-template-columns:auto auto auto;justify-content:space-between;border:2px solid var(--bianco);padding:10px;margin:18px 0 26px}
.cifre b{display:block;font-family:var(--pixel);font-weight:400;font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.cifre span{font-family:var(--pixel);font-size:15px;color:var(--tenue);text-transform:uppercase}
.top{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 12px}
.tp{display:block;min-width:0}
.tp .loc{width:100%}
.pz{position:absolute;top:0;left:0;z-index:2;font-size:16px;padding:0 5px}
.tt{display:block;font-size:17px;line-height:1;margin-top:6px}
.tr{display:block;font-size:14px;color:var(--tenue)}
.modo{justify-content:center;margin-top:32px}
.gr{display:flex;justify-content:space-between;align-items:baseline;font-size:22px;border-bottom:2px solid var(--bianco);margin-top:24px;padding-bottom:4px}
.gr span{font-size:16px;color:var(--tenue)}
.vuoto{color:var(--tenue);padding-block:12px}
.la{list-style:none}
.la li{padding-block:10px;border-bottom:2px dashed var(--filetto)}
.la a{font-size:21px;line-height:1}
.la .rr{display:block;font-size:14px;color:var(--tenue);margin-top:2px}

.piede{margin-top:40px;font-size:12px;color:var(--tenue);line-height:1.6;max-width:62ch}
.agg{font-size:15px;color:var(--tenue);text-align:center;margin-top:4px}

@media (min-width:960px){
  .schermo{max-width:1120px;padding-block:44px 64px}
  .testata .nome{font-size:30px}
  .titolo-pag{font-size:56px}
  .lista{grid-template-columns:repeat(2,minmax(0,1fr));column-gap:48px}
  .lista .wk{grid-column:1/-1}
  .card{grid-template-columns:160px minmax(0,1fr)}
  .card .loc{width:160px}
  .film{grid-template-columns:400px minmax(0,1fr);column-gap:56px;align-items:start}
  .film .col-loc{position:sticky;top:24px}
  .film h1{font-size:72px}
  .top{grid-template-columns:repeat(5,minmax(0,1fr))}
}
@media (prefers-reduced-motion:reduce){.tend{display:none}}
</style>

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<main class="schermo" id="app" aria-live="polite">
  <div class="testata px glow"><span class="nome">--- Film Agenda ---</span><span class="cura">Curated Selection by Robi Tuono</span></div>
  <p class="agg px">Caricamento della selezione…</p>
</main>

<script>
(() => {
'use strict';
const MESI = ['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
const MESI_B = ['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
const INIZIO = '2026-08';                     // primo mese dell'archivio
const CINEMA = [                               // programmazione in lingua originale (MYmovies)
  ['Cinema in v.o. a Milano', 'https://www.mymovies.it/cinema/milano/versione-originale/'],
  ['Cinema in v.o. a Monza e Brianza', 'https://www.mymovies.it/cinema/monza/versione-originale/'],
];
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const app = document.getElementById('app');
let DATI = null, FILM = [], filtro = 'tutti', modoAnno = 'mese';

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const d = s => { const [y,m,g] = s.split('-').map(Number); return new Date(y, m-1, g); };
const piu = (dt, n) => { const x = new Date(dt); x.setDate(x.getDate()+n); return x; };
const lab = dt => dt.getDate() + ' ' + MESI_B[dt.getMonth()];
const ymd = dt => dt.getFullYear() + '-' + String(dt.getMonth()+1).padStart(2,'0') + '-' + String(dt.getDate()).padStart(2,'0');
// una settimana appartiene al mese del suo giovedì
const meseDi = lun => ymd(piu(d(lun), 3)).slice(0,7);
const nomeMese = ym => MESI[+ym.slice(5)-1] + ' ' + ym.slice(0,4);
const ore = m => Math.floor(m/60) + ':' + String(m%60).padStart(2,'0');
const ext = (href, txt) => `<a href="${esc(href)}" target="_blank" rel="noopener">${txt}</a>`;
const nomi = arr => (arr||[]).map(p => p.link ? ext(p.link, esc(p.nome)) : esc(p.nome)).join(', ');
const nomiTesto = arr => (arr||[]).map(p => esc(p.nome)).join(', ');

function testata(){ return `<div class="testata px glow"><span class="nome">--- Film Agenda ---</span><span class="cura">Curated Selection by Robi Tuono</span></div>`; }
function piede(){ return `<p class="piede">Dati e locandine da TMDB. Questo prodotto usa l'API di TMDB ma non è approvato né certificato da TMDB. Disponibilità in streaming da JustWatch.</p>`; }
function locandina(f, cls){
  const inner = f.poster ? `<img src="${esc(f.poster)}" alt="Locandina di ${esc(f.titolo)}" loading="lazy" decoding="async">`
                         : `<span class="vuota px">${esc(f.titolo)}</span>`;
  return inner;
}
function barra(min, max=180){ return `<span class="dur" aria-hidden="true"><i style="width:${Math.min(100, Math.round(min/max*100))}%"></i></span>`; }
function tags(f){ return (f.sala ? '<span class="tag px">In sala</span>' : '') + (f.visto ? '<span class="tag visto px">✓ Visto</span>' : ''); }

function card(f){
  const tec = [f.camera, f.fotografia].filter(Boolean).join(' · ');
  return `<article class="card">
    <a class="loc" href="#f-${esc(f.id)}" tabindex="-1" aria-hidden="true">${locandina(f)}</a>
    <div class="meta">
      <div class="riga1 px">${esc(f.anno)}${tags(f)}</div>
      <h2 class="px glow"><a href="#f-${esc(f.id)}">${esc(f.titolo)}</a></h2>
      <div class="di px">di ${nomi(f.regia)}</div>
      <div class="gen px">${esc((f.generi||[]).join(', '))}${f.durata ? ' · ' + esc(f.durata) : ''}</div>
      ${f.minuti ? barra(f.minuti) : ''}
    </div>
    ${f.trama ? `<p class="plot">${esc(f.trama)}</p>` : ''}
    ${tec ? `<p class="tec px">${esc(tec)}</p>` : ''}
    <a class="apri px" href="#f-${esc(f.id)}">▶ Scheda</a>
  </article>`;
}

/* ---------- vista mese / settimana ---------- */
function vistaMese(ym, sett){
  const films = FILM.filter(f => meseDi(f.settimana) === ym);
  const settimane = [...new Set(films.map(f => f.settimana))].sort();
  const mesi = [...new Set(FILM.map(f => meseDi(f.settimana)))].sort();
  const prec = mesi[mesi.indexOf(ym)-1], succ = mesi[mesi.indexOf(ym)+1];
  if (!sett) sett = 'mese';
  const vis = (sett === 'mese' ? films : films.filter(f => f.settimana === sett));
  // filtri: i generi più presenti nel mese
  const conta = {}; films.forEach(f => (f.generi||[]).forEach(g => conta[g] = (conta[g]||0)+1));
  const generi = Object.entries(conta).sort((a,b) => b[1]-a[1]).slice(0,4).map(x => x[0]);
  if (filtro !== 'tutti' && !generi.includes(filtro)) filtro = 'tutti';
  const ok = f => filtro === 'tutti' || (f.generi||[]).includes(filtro);
  const mostra = vis.filter(ok);
  const tot = mostra.reduce((a,f) => a + (f.minuti||0), 0);
  const range = sett === 'mese' ? nomeMese(ym) : lab(d(sett)) + ' – ' + lab(piu(d(sett),6));

  let corpo = '';
  if (sett === 'mese') {
    settimane.forEach(w => {
      const fw = mostra.filter(f => f.settimana === w);
      if (!fw.length) return;
      corpo += `<h3 class="wk px glow">Settimana ${lab(d(w))} – ${lab(piu(d(w),6))}</h3>` + fw.map(card).join('');
    });
  } else corpo = mostra.map(card).join('');
  if (!mostra.length) corpo = `<p class="vuoto px">Nessun film di questo genere in questa vista. Scegli "Tutti".</p>`;

  app.innerHTML = testata() + `
    <h1 class="titolo-pag px inv">${esc(nomeMese(ym))}</h1>
    <nav class="navmesi px" aria-label="Mesi">
      ${prec ? `<a href="#m-${prec}">◀ ${esc(nomeMese(prec))}</a>` : '<span></span>'}
      ${succ ? `<a href="#m-${succ}">${esc(nomeMese(succ))} ▶</a>` : `<a href="#anno">Anno ▶</a>`}
    </nav>
    <nav class="scelte sett px" aria-label="Settimane">
      <a href="#m-${ym}" ${sett==='mese'?'aria-current="page"':''}>Mese</a><span class="sl" aria-hidden="true">/</span>
      ${settimane.map(w => `<a href="#w-${w}" ${sett===w?'aria-current="page"':''}>${lab(d(w))}</a>`).join('')}
    </nav>
    <div class="scelte filtri px" role="group" aria-label="Genere">
      ${['tutti', ...generi].map(g => `<button type="button" data-g="${esc(g)}" aria-pressed="${filtro===g}">${esc(g)}</button>`).join('')}
    </div>
    <div class="conta px"><span>${mostra.length} film · ${esc(range)}</span><span>Tot ${ore(tot)}:00</span></div>
    <div class="lista">${corpo}</div>` + piede();
  app.querySelectorAll('.filtri button').forEach(b => b.onclick = () => { filtro = b.dataset.g; vistaMese(ym, sett); });
  arma();
}

/* ---------- scheda film ---------- */
function vistaFilm(id){
  const f = FILM.find(x => x.id === id);
  if (!f) { app.innerHTML = testata() + `<p class="vuoto px">Questo film non è nella selezione.</p><a class="indietro px" href="#">◀ Torna alla settimana</a>`; return; }
  const righe = (arr) => arr.filter(r => r[1]).map(([k,v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('');
  const sez = (titolo, html) => html ? `<section class="sez"><h2 class="et px inv">${titolo}</h2>${html}</section>` : '';
  const regia = f.regia && f.regia.length ? `<p class="regista px">${nomi(f.regia)}</p>
      ${f.regia_frase ? `<p class="testo">${esc(f.regia_frase)}</p>` : ''}
      ${f.prima && f.prima.length ? `<dl class="righe"><dt>Quello di</dt><dd>${f.prima.map(p => (p.link ? ext(p.link, esc(p.titolo)) : esc(p.titolo)) + (p.anno ? ` <span class="anno-p">${esc(p.anno)}</span>` : '')).join('<br>')}</dd></dl>` : ''}` : '';
  const ripresaRighe = righe([['Fotografia', esc(f.fotografia)], ['Camera', esc(f.camera)], ['Montaggio', esc(f.montaggio)], ['Musiche', esc(f.musiche)], ['Scenografia', esc(f.scenografia)], ['Paese', esc(f.paesi)]]);
  const ripresa = (ripresaRighe ? `<dl class="righe">${ripresaRighe}</dl>` : '') + (f.focus ? `<p class="testo">${esc(f.focus)}</p>` : '');
  const curiosita = [f.curiosita, f.making].filter(Boolean).map(t => `<p class="testo">${esc(t)}</p>`).join('');
  const critica = (f.piu||[]).length || (f.meno||[]).length ? `<dl class="critica">${(f.piu||[]).map(n => `<dt aria-label="Piaciuto">+</dt><dd>${esc(n)}</dd>`).join('')}${(f.meno||[]).map(n => `<dt aria-label="Non piaciuto">−</dt><dd>${esc(n)}</dd>`).join('')}</dl>` : '';
  const cast = (f.cast||[]).length ? `<ul class="voci">${f.cast.map(c => `<li>${c.link ? ext(c.link, esc(c.nome)) : esc(c.nome)}${c.ruolo ? ` <span class="ruolo">${esc(c.ruolo)}</span>` : ''}</li>`).join('')}</ul>` : '';
  let dove = '';
  if (f.sala) dove = `<p class="dove">Al cinema dal ${f.data ? lab(d(f.data)) : ''}.</p><ul class="voci px">${CINEMA.map(([t,u]) => `<li>${ext(u, esc(t) + ' ▶')}</li>`).join('')}`;
  else dove = `${f.dove ? `<p class="dove">${esc(f.dove)}.</p>` : ''}<ul class="voci px">${f.dove_link ? `<li>${ext(f.dove_link, 'Dove vederlo in streaming ▶')}</li>` : ''}`;
  dove += `${f.lb ? `<li>${ext(f.lb, 'Segna su Letterboxd ▶')}</li>` : ''}</ul>`;

  app.innerHTML = testata() + `
    <a class="indietro px" href="#w-${f.settimana}">◀ Settimana del ${lab(d(f.settimana))}</a>
    <article class="film">
      <div class="col-loc"><div class="grande">${locandina(f)}</div></div>
      <div class="col-testo">
        <div class="riga1 px" style="margin-top:18px">${esc(f.anno)}${tags(f)}</div>
        <h1 class="px glow">${esc(f.titolo)}</h1>
        <div class="gen px">${esc((f.generi||[]).join(', '))}${f.durata ? ' · ' + esc(f.durata) : ''}</div>
        ${f.minuti ? barra(f.minuti) : ''}
        ${f.trama ? `<p class="frase">${esc(f.trama)}</p>` : ''}
        ${f.filo ? `<div class="filo"><span class="seg" aria-label="Perché è qui">※</span><p>${esc(f.filo)}</p></div>` : ''}
        ${sez('Regia', regia)}${sez('Ripresa', ripresa)}${sez('Curiosità', curiosita)}${sez('Critica', critica)}${sez('Cast', cast)}${sez('Dove vederlo', dove)}
      </div>
    </article>`;
  window.scrollTo(0, 0);
  arma();
}

/* ---------- pagina anno ---------- */
function vistaAnno(){
  const anno = DATI.aggiornato.slice(0,4);
  const films = FILM.filter(f => meseDi(f.settimana).startsWith(anno));
  const tot = films.reduce((a,f) => a + (f.minuti||0), 0);
  const top = films.filter(f => f.top).sort((a,b) => a.top - b.top).slice(0,10);
  const topId = new Set(top.map(f => f.id));
  const resto = films.filter(f => !topId.has(f.id));
  const riga = (f, g=true) => `<li><a class="px" href="#f-${esc(f.id)}">${esc(f.titolo)}</a>${f.visto ? ' <span class="tag visto px">✓ Visto</span>' : ''}<span class="rr px">${nomiTesto(f.regia)}${g && f.generi ? ' · ' + esc(f.generi[0]) : ''}${f.durata ? ' · ' + esc(f.durata) : ''}</span></li>`;
  // mesi dall'inizio dell'archivio al mese dell'ultimo aggiornamento
  const ultimo = meseDi(DATI.aggiornato); const mesi = [];
  for (let m = INIZIO; m <= ultimo; ) { mesi.push(m); const [y,mm] = m.split('-').map(Number); m = mm === 12 ? `${y+1}-01` : `${y}-${String(mm+1).padStart(2,'0')}`; }
  const perMese = mesi.map(m => {
    const fm = resto.filter(f => meseDi(f.settimana) === m), n = films.filter(f => meseDi(f.settimana) === m).length;
    return `<h3 class="gr px glow"><a href="#m-${m}">${esc(nomeMese(m).split(' ')[0])}</a><span>${n ? n + ' film' : 'dati in arrivo'}</span></h3>` +
      (n ? `<ul class="la">${fm.map(f => riga(f)).join('')}</ul>` : `<p class="vuoto">La selezione di ${esc(nomeMese(m).split(' ')[0])} non è ancora stata fatta.</p>`);
  }).join('');
  const gruppi = {}; resto.forEach(f => (gruppi[(f.generi||['Altro'])[0]] ||= []).push(f));
  const perGenere = Object.keys(gruppi).sort().map(g => `<h3 class="gr px glow">${esc(g)}<span>${gruppi[g].length} film</span></h3><ul class="la">${gruppi[g].map(f => riga(f, false)).join('')}</ul>`).join('');
  const ultimoMese = mesi[mesi.length-1];
  app.innerHTML = testata() + `
    <h1 class="titolo-pag px inv">${anno}</h1>
    <nav class="navmesi px" aria-label="Mesi"><a href="#m-${ultimoMese}">◀ ${esc(nomeMese(ultimoMese))}</a><span></span></nav>
    <div class="cifre"><div><b>${films.length}</b><span>film</span></div><div><b>${ore(tot)}</b><span>ore di cinema</span></div><div><b>${films.filter(f => f.sala).length}</b><span>in sala</span></div></div>
    ${top.length ? `<h2 class="et px inv">Top 10 dell'anno</h2><div class="top">${top.map(f => `<a class="tp" href="#f-${esc(f.id)}"><span class="loc">${locandina(f)}<span class="pz px inv">${String(f.top).padStart(2,'0')}</span></span><span class="tt px">${esc(f.titolo)}</span><span class="tr px">${nomiTesto(f.regia)}</span></a>`).join('')}</div>` : ''}
    <div class="scelte modo px" role="group" aria-label="Ordina l'elenco"><button type="button" data-m="mese" aria-pressed="${modoAnno==='mese'}">Per mese</button><span class="sl" aria-hidden="true">/</span><button type="button" data-m="genere" aria-pressed="${modoAnno==='genere'}">Per genere</button></div>
    <div class="elenco">${modoAnno === 'mese' ? perMese : perGenere}</div>` + piede();
  app.querySelectorAll('.modo button').forEach(b => b.onclick = () => { modoAnno = b.dataset.m; vistaAnno(); });
  arma();
}

/* ---------- tendina DV: la locandina sale dal basso a scatti, con macroblocchi ---------- */
function tendina(img){
  if (RM || !img.complete || !img.naturalWidth) return;
  const box = img.parentElement; box.querySelectorAll('.tend').forEach(c => c.remove());
  const W = box.clientWidth, H = box.clientHeight; if (!W) return;
  const c = document.createElement('canvas'); c.className = 'tend'; c.width = W; c.height = H; box.appendChild(c);
  const x = c.getContext('2d'), N = 6, band = Math.ceil(H/N), MB = W > 200 ? 24 : 12;
  const tmp = document.createElement('canvas'); tmp.width = Math.ceil(W/MB); tmp.height = Math.ceil(H/MB);
  tmp.getContext('2d').drawImage(img, 0, 0, tmp.width, tmp.height); x.imageSmoothingEnabled = false;
  const blu = getComputedStyle(document.documentElement).getPropertyValue('--blu').trim();
  x.fillStyle = blu; x.fillRect(0, 0, W, H); let k = 0;
  (function passo(){
    if (k > N) { c.remove(); return; }
    x.fillStyle = blu; x.fillRect(0, 0, W, H - k*band);
    x.clearRect(0, H - (k-1)*band, W, (k-1)*band);
    if (k > 0) {
      const y = Math.max(0, H - k*band);
      x.save(); x.beginPath(); x.rect(0, y, W, band); x.clip(); x.drawImage(tmp, 0, 0, tmp.width*MB, tmp.height*MB); x.restore();
      x.fillStyle = blu; for (let i = 0; i < W; i += MB) if (Math.random() < .45) x.fillRect(i, y, MB, MB/1.5);
    }
    k++; setTimeout(passo, 90);
  })();
}
const osserva = 'IntersectionObserver' in window ? new IntersectionObserver(es => es.forEach(e => {
  if (!e.isIntersecting) return; osserva.unobserve(e.target);
  const img = e.target; if (img.complete) tendina(img); else img.addEventListener('load', () => tendina(img), {once:true});
}), {threshold: .35}) : null;
function arma(){
  if (!osserva || RM) return;
  app.querySelectorAll('.loc img, .grande img').forEach(i => osserva.observe(i));
  app.querySelectorAll('.grande').forEach(g => g.addEventListener('click', () => tendina(g.querySelector('img'))));
}

/* ---------- router: #w-AAAA-MM-GG, #m-AAAA-MM, #f-id, #anno ---------- */
function vai(){
  const h = location.hash.slice(1);
  const ultima = DATI.aggiornato;
  if (h.startsWith('f-')) return vistaFilm(h.slice(2));
  if (h === 'anno') return vistaAnno();
  if (/^m-\d{4}-\d{2}$/.test(h)) return vistaMese(h.slice(2), 'mese');
  if (/^w-\d{4}-\d{2}-\d{2}$/.test(h) && FILM.some(f => f.settimana === h.slice(2))) return vistaMese(meseDi(h.slice(2)), h.slice(2));
  vistaMese(meseDi(ultima), ultima);       // apertura: l'ultima settimana aggiornata
}
let ultimoHash = null;
window.addEventListener('hashchange', () => {
  const vecchio = ultimoHash; ultimoHash = location.hash; vai();
  if (!location.hash.startsWith('#f-') && !(vecchio || '').startsWith('#f-')) window.scrollTo(0, 0);
});

fetch('dati.json').then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(j => {
  DATI = j; FILM = j.film; ultimoHash = location.hash; vai();
}).catch(() => {
  app.innerHTML = testata() + `<p class="vuoto px">Non riesco a caricare la selezione. Ricarica la pagina tra poco.</p>`;
});
})();
</script>
